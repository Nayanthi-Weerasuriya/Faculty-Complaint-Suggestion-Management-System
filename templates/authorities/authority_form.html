{% extends 'base.html' %}

{% block title %}{{ title }} - FMSC Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white py-3 border-bottom">
                <h5 class="fw-bold mb-0 text-dark">{{ title }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Authority Name <span class="text-danger">*</span></label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Officer in Charge Name <span class="text-danger">*</span></label>
                        {{ form.officer_name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Official Designation <span class="text-danger">*</span></label>
                        {{ form.designation }}
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-7">
                            <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            {{ form.email }}
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-semibold">Phone / Extension</label>
                            {{ form.phone }}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Unit / Sub-Division</label>
                        {{ form.unit }}
                    </div>
                    <div class="mb-4 form-check">
                        {{ form.is_active }}
                        <label class="form-check-label fw-semibold ms-2" for="{{ form.is_active.id_for_label }}">
                            Active Authority (Available for case assignment)
                        </label>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'authority_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary" style="background-color: #002b49;">Save Authority</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
