{% extends 'base.html' %}
{% block body_class %}auth-page{% endblock %}{% block content %}<div class="card p-4 mx-auto" style="max-width:600px"><h3>Choose a new password</h3>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save password</button></form>{% else %}<p>This link is invalid or expired. Request a new reset link.</p>{% endif %}<a class="mt-3" href="{% url 'login' %}">Return to sign in</a></div>{% endblock %}
