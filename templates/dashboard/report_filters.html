<form method="get" class="row g-3 mb-4 p-3 bg-light rounded">
    {% if report_filters.non_field_errors %}<div class="col-12 text-danger">{{ report_filters.non_field_errors }}</div>{% endif %}
    {% for field in report_filters %}<div class="col-sm-6 col-lg-2"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}<div class="text-danger small">{{ field.errors }}</div></div>{% endfor %}
    <div class="col-12"><button type="submit" class="btn btn-primary">Apply Filters</button> <a href="{{ request.path }}" class="btn btn-outline-secondary">Reset</a></div>
</form>
